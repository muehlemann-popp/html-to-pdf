name: Release version

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

# reads the repository; DockerHub is reached with its own secrets, the layer cache needs no token scope
permissions:
  contents: read

# one release build per branch or tag at a time, never cancelled half-pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # needed to properly run buildx, otherwise buildx fails
      # https://github.com/docker/buildx/issues/495#issuecomment-1043341496
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: amd64,arm64

      - name: Define docker image metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: muehlemannpopp/html-to-pdf
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=git-,format=short

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # one cache per day, as in default.yml: the published image must not ship the Alpine packages
      # (Chromium) of an old cached `apk upgrade` layer. Pushing main and then a tag on the same day, the
      # tag's build reuses everything
      - name: Name the layer cache of the day
        id: cache
        run: echo "scope=release-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          # build from the checkout (path context), not bake-action's default git context
          source: .
          push: true
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build
          # ignore-error: main and a tag build in parallel (different concurrency groups) and may write the
          # same scope; a failed cache upload must not fail a release whose image is already pushed
          set: |
            *.cache-from=type=gha,scope=${{ steps.cache.outputs.scope }}
            *.cache-to=type=gha,scope=${{ steps.cache.outputs.scope }},mode=max,ignore-error=true
