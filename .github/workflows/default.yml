name: Quality check

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-26.04
    env:
      TAG: html-to-pdf
      PUPPETEER_SKIP_DOWNLOAD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build --file deploy/Dockerfile --target test --tag ${TAG} .
      - name: Run lint in a container
        run: docker run --rm ${TAG} yarn lint --max-warnings 0
      - name: Run test in a container
        run: docker run --rm ${TAG} yarn test
      - name: Run test in a container with the Chromium sandbox
        run: docker run --rm --env CHROME_SANDBOX=1 --security-opt seccomp=deploy/chrome-seccomp.json ${TAG} yarn test
      - name: Run test in a container with the Chromium sandbox and the Kubernetes profile
        run: docker run --rm --env CHROME_SANDBOX=1 --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=deploy/chrome-seccomp-kubernetes.json ${TAG} yarn test
