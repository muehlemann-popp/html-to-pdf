compressionLevel: mixed

enableGlobalCache: false

# Chromium comes from the OS (apk / local install), puppeteer's postinstall download is never needed
enableScripts: false

nodeLinker: node-modules

# Only install package versions published at least two weeks ago (value is in
# minutes), so freshly published/compromised releases are not picked up.
npmMinimalAgeGate: 20160

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"
  html-to-pdf@*:
    dependencies:
      cookie: "*"
      tslib: "*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
